[tools]
rust = "1.95.0"

[env]
# One Cargo target directory per worktree, keyed by that worktree's own path.
#
# The cache lives outside the checkout (nothing to gitignore, survives worktree
# churn at the same path), but worktrees never share artifacts. They must not:
# Cargo hashes path packages relative to the workspace root so builds stay
# relocatable, which means two worktrees of this repo produce byte-identical
# artifact filenames. In a shared directory the only thing left to tell them
# apart is mtime, and a fresh `git worktree add` writes sources older than a
# sibling's newer build -- so Cargo calls the sibling's artifact fresh and links
# it. The gate then answers for code that is not in front of it, in either
# direction (TASK-179). Callers such as CI can still set CARGO_TARGET_DIR
# explicitly to keep a workspace-local target.
CARGO_TARGET_DIR = { default = "{{ xdg_cache_home }}/switchbard/cargo-target/{{ config_root | basename }}-{{ config_root | hash(len=8) }}" }

[tasks.fmt]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks.clippy]
description = "Run clippy with CI warning policy"
env = { RUSTFLAGS = "-D warnings" }
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.test]
description = "Run the full workspace test suite"
env = { RUSTFLAGS = "-D warnings" }
run = "cargo test --workspace --all-targets"

[tasks.ci]
description = "Run the complete local quality gate"
run = [
  { task = "fmt" },
  { task = "clippy" },
  { task = "test" },
  { task = "test-dev-gates" },
]

[tasks.test-dev-gates]
description = "Exercise Git hooks and CI routing contracts"
run = "bash scripts/test-developer-gates.sh"

[tasks.preflight]
description = "Run the complete local gate before a push"
run = { task = "ci" }

[tasks.target-prune]
description = "List Cargo target directories no live worktree owns (--yes removes them)"
run = "bash scripts/prune-cargo-targets.sh"

[tasks.hooks-install]
description = "Install the tracked pre-commit and pre-push hooks"
run = "bash scripts/install-git-hooks.sh"

[tasks.build]
description = "Build the release binary"
run = "cargo build --release -p switchbard-gui"

[tasks.bundle]
description = "Build the alpha macOS app bundle"
run = "bash scripts/bundle-mac.sh"

[tasks.package]
description = "Build an alpha macOS DMG and checksum"
depends = ["ci"]
run = "bash scripts/package-dmg.sh"

[tasks.tui]
description = "Check only the TUI crate (no RUSTFLAGS so the workspace build cache stays warm)"
run = [
  "cargo fmt --all -- --check",
  "cargo clippy -p switchbard-tui --all-targets -- -D warnings",
  "cargo test -p switchbard-tui",
]

[tasks.hooks-test]
description = "Run the Claude hook regression tests (main-checkout-guard)"
run = "python3 -m pytest -q tests/hooks"

[tasks.tui-install]
description = "Check the TUI crate, then install sbt; a running sbt re-execs itself"
depends = ["tui"]
run = "bash scripts/install-switchbard.sh sbt"

[tasks.install]
description = "Install sb and sbt from this worktree, refusing a silent downgrade"
run = "bash scripts/install-switchbard.sh"
