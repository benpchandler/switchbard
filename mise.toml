[tools]
rust = "1.95.0"

[env]
# Reuse rebuildable Cargo artifacts across linked worktrees. Callers such as CI
# can keep a workspace-local target by setting CARGO_TARGET_DIR explicitly.
CARGO_TARGET_DIR = { default = "{{ xdg_cache_home }}/switchbard/cargo-target" }

[tasks.fmt]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks.clippy]
description = "Run clippy with CI warning policy"
env = { RUSTFLAGS = "-D warnings" }
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.test]
description = "Run the full workspace test suite"
env = { RUSTFLAGS = "-D warnings" }
run = "cargo test --workspace --all-targets"

[tasks.ci]
description = "Run the complete local quality gate"
run = [
  { task = "fmt" },
  { task = "clippy" },
  { task = "test" },
  { task = "test-dev-gates" },
]

[tasks.test-dev-gates]
description = "Exercise Git hooks and CI routing contracts"
run = "bash scripts/test-developer-gates.sh"

[tasks.preflight]
description = "Run the complete local gate before a push"
run = { task = "ci" }

[tasks.hooks-install]
description = "Install the tracked pre-commit and pre-push hooks"
run = "bash scripts/install-git-hooks.sh"

[tasks.build]
description = "Build the release binary"
run = "cargo build --release -p switchbard-gui"

[tasks.bundle]
description = "Build the alpha macOS app bundle"
run = "bash scripts/bundle-mac.sh"

[tasks.package]
description = "Build an alpha macOS DMG and checksum"
depends = ["ci"]
run = "bash scripts/package-dmg.sh"
