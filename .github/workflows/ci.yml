name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# PR runs supersede each other; a push to main is the merge-commit proof and
# must run to completion, so it is never cancelled by the next merge.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target
  XPLAN_SIDECAR_PYTHON: "3.12.11"

jobs:
  change-scope:
    name: Validate developer gates and route expensive CI
    runs-on: ubuntu-latest
    outputs:
      mission_sidecar: ${{ steps.scope.outputs.mission_sidecar }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Exercise hooks and workflow routing contracts
        run: scripts/test-developer-gates.sh

      - name: Determine whether mission-sidecar proofs are required
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          scripts/ci-mission-sidecar-diff.sh \
            --github-output "$GITHUB_OUTPUT" "$BASE_SHA" "$HEAD_SHA"

  ci:
    name: ${{ matrix.os }} - mise run ${{ matrix.task }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            task: fmt
          - os: ubuntu-latest
            task: clippy
          - os: ubuntu-latest
            task: test
          - os: macos-latest
            task: clippy
          - os: macos-latest
            task: test
    steps:
      - uses: actions/checkout@v4

      - name: Install mise tools
        uses: jdx/mise-action@v4

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      # rust-cache prunes target/ to dependency artifacts only (workspace crates
      # always rebuild) and saves only from main, so PR branches restore a warm
      # cache without each adding multi-GB entries against the 10 GB repo cap.
      - name: Cache cargo registry + dependency build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.task }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run task — ${{ matrix.task }}
        run: mise run ${{ matrix.task }}

  mission-sidecar:
    name: mission-sidecar-${{ matrix.target }}-${{ matrix.arch }}
    needs: change-scope
    if: needs.change-scope.outputs.mission_sidecar == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
            arch: arm64
            pin_target: macos-arm64
            artifact: mission-sidecar-macos
          - os: ubuntu-latest
            target: linux
            arch: x86_64
            pin_target: linux-x86_64
            artifact: mission-sidecar-linux
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.7"
          enable-cache: false

      - name: Build and verify exact xplan helper
        run: |
          set -euo pipefail
          eval "$(python3 - <<'PY'
          import json, shlex
          pin=json.load(open('xplan-sidecar-pin.json'))
          target=pin['targets']['${{ matrix.pin_target }}']
          print(f"ARCHIVE_NAME={shlex.quote(target['archive_name'])}")
          PY
          )"
          XPLAN_SOURCE="$RUNNER_TEMP/xplan-source"
          XPLAN_OUTPUT="$RUNNER_TEMP/xplan-output"
          export UV_PYTHON_INSTALL_DIR="$RUNNER_TEMP/uv-python"
          export UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/xplan-sidecar-venv"
          scripts/checkout-pinned-xplan.sh --destination "$XPLAN_SOURCE"
          uv python install "$XPLAN_SIDECAR_PYTHON"
          uv run --python "$XPLAN_SIDECAR_PYTHON" --locked --project "$XPLAN_SOURCE/sidecar" \
            python "$XPLAN_SOURCE/scripts/build_mission_sidecar.py" \
            --target host --output "$XPLAN_OUTPUT"
          mkdir -p "$RUNNER_TEMP/mission-sidecar-raw"
          cp "$XPLAN_OUTPUT/$ARCHIVE_NAME" "$RUNNER_TEMP/mission-sidecar-raw/$ARCHIVE_NAME"
          scripts/acquire-xplan-mission-sidecar.sh \
            --pin xplan-sidecar-pin.json \
            --target-os "${{ matrix.target }}" \
            --arch "${{ matrix.arch }}" \
            --source "$XPLAN_SOURCE" \
            --artifact "$XPLAN_OUTPUT/$ARCHIVE_NAME" \
            --mode ci \
            --destination "$RUNNER_TEMP/mission-sidecar-artifact" \
            | tee "$RUNNER_TEMP/acquire-summary.json"

      - name: Upload raw helper archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-raw
          path: ${{ runner.temp }}/mission-sidecar-raw
          if-no-files-found: error

      - name: Upload verified helper manifest tree
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/mission-sidecar-artifact
          if-no-files-found: error

      - name: Install mise tools
        uses: jdx/mise-action@v4

      - name: Cache cargo registry + dependency build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: mission-sidecar
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run live mission proofs against the verified helper
        run: |
          set -euo pipefail
          HELPER="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["helper_path"])' "$RUNNER_TEMP/acquire-summary.json")"
          STATE="$RUNNER_TEMP/mission-live-state"
          mkdir -p "$STATE"
          cargo run --quiet -p switchbard-gui --bin switchbard -- \
            --mission-sidecar-journey queue \
            --state-root "$STATE" \
            --helper "$HELPER" \
            --fixture sidecar-contract-review-v1
          XPLAN_MISSION_HELPER="$HELPER" \
            cargo test -p switchbard-gui --test mission_command_sidecar
          XPLAN_MISSION_HELPER="$HELPER" XPLAN_MISSION_STATE="$STATE" \
            cargo test -p switchbard-core --test mission_sidecar -- --exact \
            mission_fresh_supervisor_recovers_pending_contract \
            mission_projection_v2_enables_controls
